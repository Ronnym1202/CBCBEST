<!DOCTYPE html>
<html lang="en-KE">
<head>
  <meta charset="UTF-8">
  <title>CBC Best</title>
  <script>
    const p = new URLSearchParams(window.location.search);
    const url = p.get('url');
    const text = p.get('text');
    if (url) {
      window.location.replace('/?shared=' + encodeURIComponent(url));
    } else if (text) {
      window.location.replace('/?q=' + encodeURIComponent(text));
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body></body>
</html>
